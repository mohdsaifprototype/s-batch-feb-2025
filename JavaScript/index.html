<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>September 13 | JavaScript</title>
</head>

<body>
	<h1>JavaScript demo</h1>
	<div>
		<h2>This is level 2 heading</h2>
		<button onclick="changeBG()">Change BG</button>
	</div>

	<script>
		function changeBG() {
			document.body.style.backgroundColor = "yellow";
			document.querySelector("h2").innerText = "I know you pressed the button to change bg!"
		}
	</script>
</body>

</html>
