  <title>July 08 | CSS Flex</title>
  <link rel="stylesheet" href="index.css">

<body>
  <header>
    <h1>CSS: Navbar Using CSS Flex</h1>
  </header>
  <!--
    Navbar
    In a navbar there will be a few segments such as:
    1. Nav-logo for the brand
    2. Navigational links for different webpages
    3. Call to action buttons for call, mail, login/signup etc.
    4. search input field to search topics withing the website etc.
    5. your creativity and imagination 
  -->
  <nav class="navbar">
    <img class="nav-logo" src="https://placehold.co/80" alt="brand-logo">

    <!-- navigational links -->
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="contact.html">Contact</a>
      <a href="about.html">About</a>
      <a href="more.html">More</a>
    </div>

    <!-- Call to action buttons -->
     <div class="ctas">
       <button class="btn btn-primary">Call us</button>
       <button class="btn btn-secondary">Login</button>
     </div>
  </nav>
  <main>
    <div class="container">
      <h2>This is a container</h2>
      <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Illo dolorum, nulla nemo quos, nam reprehenderit deserunt, iste id odio aut alias fuga natus ab ipsam quae soluta excepturi similique. Maiores.</p>
    </div>
  </main>

  <footer>
    <p>&copy; All rights reserved</p>
  </footer>
</body>

</html>
